[package]
name = "pg-profiles"
version = "0.1.0"
edition = "2021"
description = "Saved connection profiles: settings in a JSON file, passwords in the OS credential store"
license = "MIT"

[dependencies]
pg-core = { path = "../pg-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Windows Credential Manager on Windows, Keychain on macOS, Secret Service on Linux.
keyring = "4"

[dev-dependencies]
tempfile = "3"
